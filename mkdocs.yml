site_name: MistBot Documentation
theme:
  name: material
  font:
    text: Roboto  # Professional Google font
  features:
    - navigation.tabs        # Top-level tabs
    - navigation.tabs.sticky # Keeps tabs visible while scrolling
    - navigation.sections    # Organized sidebar groupings
    - search.highlight       # High-quality search experience

