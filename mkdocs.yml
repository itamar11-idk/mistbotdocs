  - Recruitment:
      - Lobbies: modules/lobby.md
      - Vouching System: modules/vouches.md
  - AI Assistant: modules/mist_ai.md
  - Security: modules/security.md
  - Staff & Config:
      - Admin Tools: modules/admin.md
      - Setup Wizard: modules/setup.md
      - Maintenance: modules/developer.md
  - Info:
      - General: modules/general.md
      - Help: modules/help.md
  - Credits:
      - Contributors: contributors.md
  - Legal:
      - Terms of Service: tos.md
